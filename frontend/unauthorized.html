<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResQAI — 401 Unauthorized</title>
  <meta name="description" content="You do not have permission to access this ResQAI resource.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/buttons.css">
  <link rel="stylesheet" href="css/animations.css">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; }
    .unauthorized-wrap { max-width: 520px; padding: 40px 24px; }
    .unauth-icon {
      width: 100px; height: 100px; border-radius: 50%; margin: 0 auto 28px;
      background: rgba(239,68,68,0.12); color: var(--danger);
      display: flex; align-items: center; justify-content: center; font-size: 2.5rem;
      border: 2px solid rgba(239,68,68,0.25);
    }
    .unauth-code  { font-size: 5rem; font-weight: 900; line-height: 1; color: var(--danger); opacity: 0.15; }
    .unauth-title { font-size: 2rem; font-weight: 800; color: var(--text-primary); margin-bottom: 12px; margin-top: -24px; }
    .unauth-sub   { color: var(--text-muted); font-size: 1rem; line-height: 1.7; margin-bottom: 28px; }
  </style>
</head>
<body>
  <div class="unauthorized-wrap">
    <div class="unauth-code">401</div>
    <div class="unauth-icon">
      <i class="fa fa-shield-alt"></i>
    </div>
    <h1 class="unauth-title">Access Denied</h1>
    <p class="unauth-sub">
      You do not have permission to access this page.
      This area may require a different role or an active login session.
    </p>
    <div class="d-flex gap-3 justify-content-center flex-wrap">
      <a href="login.html" class="btn btn-primary btn-lg">
        <i class="fa fa-sign-in-alt me-2"></i>Sign In
      </a>
      <a href="index.html" class="btn btn-secondary btn-lg">
        <i class="fa fa-home me-2"></i>Go Home
      </a>
    </div>
    <p style="margin-top:28px;font-size:0.8rem;color:var(--text-muted);">
      ResQ<span style="color:var(--primary);">AI</span> — Smart Disaster Response Platform
    </p>
  </div>
</body>
</html>
