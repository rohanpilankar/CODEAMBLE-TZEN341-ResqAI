<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResQAI — Under Maintenance</title>
  <meta name="description" content="ResQAI is currently undergoing scheduled maintenance. We'll be back shortly.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/buttons.css">
  <link rel="stylesheet" href="css/animations.css">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; }
    .maintenance-wrap { max-width: 520px; padding: 40px 24px; }
    .maint-icon {
      width: 100px; height: 100px; border-radius: 50%; margin: 0 auto 28px;
      background: rgba(245,158,11,0.12); color: var(--warning);
      display: flex; align-items: center; justify-content: center; font-size: 2.5rem;
      border: 2px solid rgba(245,158,11,0.25);
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }
    .maint-title { font-size: 2rem; font-weight: 800; color: var(--text-primary); margin-bottom: 12px; }
    .maint-sub   { color: var(--text-muted); font-size: 1rem; line-height: 1.7; margin-bottom: 28px; }
    .eta-badge   {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 20px; border-radius: 30px;
      background: rgba(245,158,11,0.12); color: var(--warning);
      border: 1px solid rgba(245,158,11,0.3); font-weight: 600; font-size: 0.9rem;
      margin-bottom: 28px;
    }
  </style>
</head>
<body>
  <div class="maintenance-wrap">
    <div class="maint-icon">
      <i class="fa fa-tools"></i>
    </div>
    <h1 class="maint-title">Under Maintenance</h1>
    <p class="maint-sub">
      ResQAI is currently undergoing scheduled maintenance to improve performance and reliability.
      All emergency services remain operational — please use emergency hotlines if needed.
    </p>
    <div class="eta-badge">
      <i class="fa fa-clock"></i>
      <span>Estimated downtime: 30 minutes</span>
    </div>
    <div class="d-flex gap-3 justify-content-center flex-wrap">
      <a href="tel:112" class="btn btn-danger btn-lg">
        <i class="fa fa-phone me-2"></i>Emergency: 112
      </a>
      <a href="index.html" class="btn btn-secondary btn-lg">
        <i class="fa fa-home me-2"></i>Home
      </a>
    </div>
    <p style="margin-top:28px;font-size:0.8rem;color:var(--text-muted);">
      ResQ<span style="color:var(--primary);">AI</span> — Smart Disaster Response Platform
    </p>
  </div>
</body>
</html>
